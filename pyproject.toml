[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fringepay"
version = "0.1.0"
description = "Provider-independent payment orchestration infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - license decision pending" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
]

[project.scripts]
fringepay-worker = "fringepay.worker:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0", "pytest-asyncio>=0.24,<1.0", "aiosqlite>=0.20,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/fringepay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
