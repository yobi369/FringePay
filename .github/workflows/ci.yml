name: CI

on:
  push:
    branches: [main, "foundation/**", "launch/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FRINGEPAY_TEST_DATABASE_URL: postgresql+asyncpg://fringepay:fringepay_test@localhost:5432/fringepay_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fringepay_test
          POSTGRES_USER: fringepay
          POSTGRES_PASSWORD: fringepay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fringepay -d fringepay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
